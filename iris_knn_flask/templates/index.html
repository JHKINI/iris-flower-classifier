<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris KNN 분류기</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f3f5f7;
            color: #263238;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; text-align: center; }
        .description { text-align: center; color: #65727b; margin-bottom: 28px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        label { display: block; margin-bottom: 7px; font-weight: 600; }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd3d8;
            border-radius: 7px;
            font-size: 16px;
        }
        button {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #287a67;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #206452; }
        .result {
            margin-top: 30px;
            padding: 22px;
            text-align: center;
            background: #eef7f3;
            border-radius: 12px;
        }
        .result h2 { margin-top: 0; }
        .result img {
            display: block;
            width: 100%;
            max-width: 360px;
            max-height: 280px;
            object-fit: contain;
            margin: 16px auto 0;
            border-radius: 8px;
        }
        .error { margin-top: 20px; color: #c62828; text-align: center; }
        @media (max-width: 560px) {
            .form-grid { grid-template-columns: 1fr; }
            .container { padding: 22px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>붓꽃 품종 예측 (KNN)</h1>
        <p class="description">꽃받침과 꽃잎의 크기를 입력하면 붓꽃 품종을 예측합니다.</p>

        <form method="post">
            <div class="form-grid">
                <div>
                    <label for="sepal_length">Sepal Length (꽃받침 길이)</label>
                    <input id="sepal_length" type="number" step="0.01" name="sepal_length" required>
                </div>
                <div>
                    <label for="sepal_width">Sepal Width (꽃받침 너비)</label>
                    <input id="sepal_width" type="number" step="0.01" name="sepal_width" required>
                </div>
                <div>
                    <label for="petal_length">Petal Length (꽃잎 길이)</label>
                    <input id="petal_length" type="number" step="0.01" name="petal_length" required>
                </div>
                <div>
                    <label for="petal_width">Petal Width (꽃잎 너비)</label>
                    <input id="petal_width" type="number" step="0.01" name="petal_width" required>
                </div>
            </div>
            <button type="submit">품종 예측하기</button>
        </form>

        {% if result %}
        <section class="result">
            <h2>예측 결과: {{ result.korean }} ({{ result.name }})</h2>
            <p>입력한 측정값에 가장 가까운 품종으로 분류되었습니다.</p>
            <img src="{{ url_for('flower_image', filename=result.image) }}"
                 alt="{{ result.name }} 붓꽃 이미지">
        </section>
        {% endif %}

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </main>
</body>
</html>
